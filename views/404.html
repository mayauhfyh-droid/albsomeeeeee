<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="shortcut icon" href="/assets/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/favicon.svg">
    <meta property="og:site_name" content="خدماتك الرقمية">
    <meta name="application-name" content="خدماتك الرقمية">
    <meta name="apple-mobile-web-app-title" content="خدماتك الرقمية">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — الصفحة غير موجودة | خدماتك الرقمية</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-page-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1.5rem;
        }
        .error-code {
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 900;
            line-height: 1;
            color: #0f172a;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 0.75rem;
        }
        .error-desc {
            color: #64748b;
            font-size: 1rem;
            max-width: 480px;
            margin: 0 auto 2rem auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="brand-text">
                    <span>خدماتك الرقمية</span>
                    <span class="brand-dot"></span>
                </a>
                <a href="/" class="btn btn-primary btn-sm">الرئيسية</a>
            </nav>
        </div>
    </header>

    <main class="error-page-container">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">عذراً، الصفحة غير موجودة</h1>
            <p class="error-desc">قد يكون الرابط الذي طلبته غير صحيح، أو تم نقل الصفحة أو حذفها.</p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="/" class="btn btn-primary btn-lg">العودة للصفحة الرئيسية</a>
                <a href="/contact" class="btn btn-secondary btn-lg">تواصل معنا</a>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
