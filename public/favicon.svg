<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background App Icon Shape with Rounded Corners -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#primaryGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Code Brackets & Slash -->
  <!-- Left Bracket < -->
  <path d="M190 170L105 256L190 342" stroke="url(#codeGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Bracket > -->
  <path d="M322 170L407 256L322 342" stroke="url(#codeGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Slash / -->
  <path d="M280 150L232 362" stroke="#bae6fd" stroke-width="32" stroke-linecap="round"/>
</svg>