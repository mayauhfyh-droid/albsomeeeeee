<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 460" width="650" height="460" fill="none">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Laptop Display Frame -->
  <g filter="url(#soft-shadow)">
    <!-- Outer Frame -->
    <rect x="50" y="30" width="510" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Laptop Top Bar / Controls -->
    <rect x="50" y="30" width="510" height="36" rx="10" fill="#f8fafc" />
    <circle cx="75" cy="48" r="4.5" fill="#f87171" />
    <circle cx="89" cy="48" r="4.5" fill="#fbbf24" />
    <circle cx="103" cy="48" r="4.5" fill="#34d399" />
    <!-- Clean Search/URL Bar -->
    <rect x="180" y="38" width="250" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="230" y="44" width="150" height="8" rx="2" fill="#94a3b8" opacity="0.6" />

    <!-- Screen Website Mockup (Clean SaaS Layout) -->
    <rect x="51" y="66" width="508" height="283" fill="#ffffff" />
    
    <!-- Mini Navbar inside Mockup -->
    <rect x="51" y="66" width="508" height="34" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    <rect x="470" y="76" width="70" height="14" rx="3" fill="#0284c7" />
    <rect x="370" y="79" width="35" height="8" rx="2" fill="#475569" />
    <rect x="315" y="79" width="40" height="8" rx="2" fill="#475569" />
    <rect x="260" y="79" width="40" height="8" rx="2" fill="#475569" />
    <rect x="70" y="76" width="55" height="14" rx="3" fill="#0284c7" />

    <!-- Mini Hero Section inside Mockup -->
    <rect x="51" y="100" width="508" height="100" fill="#f8fafc" />
    <rect x="200" y="118" width="210" height="16" rx="3" fill="#0f172a" />
    <rect x="160" y="142" width="290" height="8" rx="2" fill="#64748b" />
    <rect x="270" y="162" width="70" height="22" rx="4" fill="#0284c7" />
    <rect x="350" y="162" width="70" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Mini Feature Cards Grid -->
    <rect x="75" y="215" width="135" height="115" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="90" y="230" width="28" height="28" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <path d="M98 244l4 4 8-8" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <rect x="90" y="268" width="80" height="8" rx="2" fill="#0f172a" />
    <rect x="90" y="282" width="105" height="6" rx="2" fill="#94a3b8" />
    <rect x="90" y="293" width="75" height="6" rx="2" fill="#94a3b8" />

    <rect x="235" y="215" width="135" height="115" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect x="250" y="230" width="28" height="28" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <circle cx="264" cy="244" r="6" stroke="#0284c7" stroke-width="2" />
    <rect x="250" y="268" width="80" height="8" rx="2" fill="#0f172a" />
    <rect x="250" y="282" width="105" height="6" rx="2" fill="#94a3b8" />
    <rect x="250" y="293" width="75" height="6" rx="2" fill="#94a3b8" />

    <rect x="395" y="215" width="135" height="115" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="410" y="230" width="28" height="28" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <rect x="418" y="238" width="12" height="12" rx="2" fill="#0284c7" />
    <rect x="410" y="268" width="80" height="8" rx="2" fill="#0f172a" />
    <rect x="410" y="282" width="105" height="6" rx="2" fill="#94a3b8" />
    <rect x="410" y="293" width="75" height="6" rx="2" fill="#94a3b8" />

    <!-- Laptop Base -->
    <path d="M20 350H590L620 370H-10L20 350Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    <rect x="270" y="352" width="70" height="4" rx="2" fill="#94a3b8" />
  </g>

  <!-- Clean Floating Mobile Mockup -->
  <g filter="url(#soft-shadow)">
    <rect x="470" y="160" width="150" height="280" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <!-- Dynamic Notch -->
    <rect x="525" y="168" width="40" height="7" rx="3.5" fill="#0f172a" />
    
    <!-- Mobile Screen UI -->
    <rect x="473" y="180" width="144" height="254" fill="#f8fafc" />
    
    <!-- Mobile App Header -->
    <rect x="473" y="180" width="144" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="483" y="190" width="40" height="10" rx="2" fill="#0284c7" />
    
    <!-- Mobile Card 1 -->
    <rect x="481" y="218" width="128" height="65" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="490" y="228" width="60" height="8" rx="2" fill="#0f172a" />
    <rect x="490" y="240" width="90" height="6" rx="2" fill="#94a3b8" />
    <rect x="490" y="255" width="45" height="16" rx="3" fill="#0284c7" />

    <!-- Mobile Card 2 -->
    <rect x="481" y="291" width="128" height="65" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="490" y="301" width="75" height="8" rx="2" fill="#0f172a" />
    <rect x="490" y="313" width="85" height="6" rx="2" fill="#94a3b8" />
    <rect x="490" y="328" width="45" height="16" rx="3" fill="#059669" />

    <!-- Mobile Bottom Bar -->
    <rect x="473" y="404" width="144" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="495" cy="419" r="4" fill="#0284c7" />
    <circle cx="545" cy="419" r="4" fill="#94a3b8" />
    <circle cx="595" cy="419" r="4" fill="#94a3b8" />
  </g>

  <!-- Clean Floating Badge (Top Left) -->
  <g filter="url(#soft-shadow)">
    <rect x="20" y="80" width="165" height="52" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <rect x="30" y="92" width="28" height="28" rx="4" fill="#f0f9ff" />
    <path d="M37 106l4 4 8-8" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="103" font-family="'Alexandria', sans-serif" font-weight="700" font-size="11" fill="#0f172a">تسليم سريع 24-48h</text>
    <text x="66" y="117" font-family="'Alexandria', sans-serif" font-weight="500" font-size="9" fill="#64748b">جاهز للاستخدام الفوري</text>
  </g>
</svg>
