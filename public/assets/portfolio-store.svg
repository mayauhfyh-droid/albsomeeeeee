<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <rect width="400" height="250" fill="#f8fafc" />
  <rect x="15" y="15" width="370" height="220" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Header of Store -->
  <rect x="15" y="15" width="370" height="35" fill="#f8fafc" />
  <rect x="30" y="27" width="50" height="12" rx="3" fill="#0284c7" />
  <rect x="320" y="25" width="50" height="16" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  
  <!-- Products Grid (Clean Cards) -->
  <g transform="translate(30, 65)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="100" height="150" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="10" y="10" width="80" height="70" rx="3" fill="#f0f9ff" />
    <circle cx="50" cy="45" r="16" fill="#0284c7" fill-opacity="0.2" />
    <rect x="10" y="90" width="60" height="8" rx="2" fill="#0f172a" />
    <rect x="10" y="104" width="40" height="6" rx="2" fill="#0284c7" />
    <rect x="10" y="120" width="80" height="18" rx="3" fill="#0284c7" />

    <!-- Card 2 -->
    <rect x="120" y="0" width="100" height="150" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect x="130" y="10" width="80" height="70" rx="3" fill="#f0f9ff" />
    <circle cx="170" cy="45" r="16" fill="#0284c7" fill-opacity="0.3" />
    <rect x="130" y="90" width="60" height="8" rx="2" fill="#0f172a" />
    <rect x="130" y="104" width="40" height="6" rx="2" fill="#0284c7" />
    <rect x="130" y="120" width="80" height="18" rx="3" fill="#059669" />

    <!-- Card 3 -->
    <rect x="240" y="0" width="100" height="150" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="250" y="10" width="80" height="70" rx="3" fill="#f0f9ff" />
    <circle cx="290" cy="45" r="16" fill="#0284c7" fill-opacity="0.2" />
    <rect x="250" y="90" width="60" height="8" rx="2" fill="#0f172a" />
    <rect x="250" y="104" width="40" height="6" rx="2" fill="#0284c7" />
    <rect x="250" y="120" width="80" height="18" rx="3" fill="#0284c7" />
  </g>
</svg>
