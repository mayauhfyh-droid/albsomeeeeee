<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <rect width="400" height="250" fill="#f8fafc" />
  
  <!-- Digital Card Mockup (Rectangular Sharp Luxury) -->
  <g transform="translate(60, 25)">
    <rect width="280" height="190" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Chip & Pattern -->
    <rect x="25" y="25" width="40" height="30" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <rect x="180" y="25" width="75" height="22" rx="3" fill="#f0f9ff" />
    <text x="190" y="40" font-family="'Alexandria', sans-serif" font-size="10" font-weight="700" fill="#0284c7">VIP PASS</text>
    
    <rect x="25" y="75" width="160" height="12" rx="2" fill="#0f172a" />
    <rect x="25" y="95" width="110" height="8" rx="2" fill="#0284c7" />
    
    <!-- QR Code Mockup -->
    <g transform="translate(200, 105)">
      <rect width="55" height="55" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="6" y="6" width="14" height="14" fill="#0f172a" />
      <rect x="35" y="6" width="14" height="14" fill="#0f172a" />
      <rect x="6" y="35" width="14" height="14" fill="#0f172a" />
      <rect x="25" y="25" width="6" height="6" fill="#0284c7" />
    </g>
    
    <rect x="25" y="145" width="130" height="22" rx="3" fill="#0284c7" />
  </g>
</svg>
